<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />

  <title>测一测｜你最适合生活的城市</title>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0a0f18;
      --card:rgba(255,255,255,.085);
      --border:rgba(255,255,255,.12);
      --text:#f2f4f8;
      --muted:rgba(242,244,248,.74);
      --muted2:rgba(242,244,248,.58);
      --btn:rgba(255,255,255,.09);
      --btnHover:rgba(255,255,255,.14);
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; color:var(--text);
      background:
        radial-gradient(900px 520px at 18% 10%, rgba(120,160,255,.22), transparent 60%),
        radial-gradient(760px 460px at 88% 18%, rgba(255,180,210,.14), transparent 55%),
        radial-gradient(760px 560px at 55% 95%, rgba(140,255,220,.10), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:calc(18px + env(safe-area-inset-top)) 14px calc(70px + env(safe-area-inset-bottom));
    }
    .card{
      background:linear-gradient(180deg, var(--card), rgba(255,255,255,.05));
      border:1px solid var(--border);
      border-radius:22px;
      padding:16px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    h1{ margin:0; font-size:clamp(18px, 4.8vw, 22px); letter-spacing:.2px; }
    .sub{ margin-top:6px; font-size:clamp(13px, 3.6vw, 14px); line-height:1.65; color:var(--muted); }
    .pill{
      font-size:12px; color:var(--muted);
      padding:6px 10px; border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      align-self:flex-start;
    }
    .progress{
      height:10px; border-radius:999px; overflow:hidden;
      background:rgba(255,255,255,.1);
      margin:14px 0 18px;
    }
    .bar{ height:100%; width:0%; background:rgba(255,255,255,.8); transition:width .25s ease; }

    .q{ font-size:clamp(16px, 4.7vw, 18px); line-height:1.75; margin:6px 0 14px; }
    .opts{ display:grid; gap:12px; }
    button.opt{
      width:100%;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid var(--border);
      background:var(--btn);
      color:var(--text);
      font-size:clamp(14px, 3.9vw, 15px);
      line-height:1.55;
      text-align:left;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button.opt:hover{ background:var(--btnHover); }
    button.opt:active{ transform:scale(.995); }

    .actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .btn{
      padding:11px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:13px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{ background:rgba(255,255,255,.10); }
    .btn[disabled]{ opacity:.45; cursor:not-allowed; }

    .section{ margin-top:14px; }
    .grid{ display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:760px){ .grid{ grid-template-columns:1fr 1fr; } }
    .box{
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px 14px 12px;
    }
    .k{ font-size:13px; color:var(--muted); margin-bottom:10px; }
    .cityName{ font-size:clamp(22px, 6vw, 26px); line-height:1.25; margin:2px 0 6px; }
    .tags{ margin-top:10px; }
    .tag{
      display:inline-block;
      padding:6px 10px;
      margin:4px 6px 0 0;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
    }

    .prose{ max-width:44rem; }
    .p{

      line-height:1.85;
      letter-spacing:.1px;
      color:rgba(242,244,248,.92);
    }

    .softNote{
      color:var(--muted2);

      line-height:1.55;
      margin-top:12px;
    }

      gap:12px;
      flex-wrap:wrap;

    }

      min-width: 280px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--border);
      border-radius:16px;
      background:rgba(255,255,255,.05);
      padding:10px;

      width:100%;
      max-width:420px;
      aspect-ratio: 1/1;
      height:auto;
      display:block;
    }
    .radarLegend{
      flex: 1 1 240px;
      min-width: 220px;
      border:1px solid var(--border);
      border-radius:16px;
      background:rgba(255,255,255,.05);
      padding:12px 12px 8px;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 0;
      border-bottom:1px dashed rgba(255,255,255,.12);
    }
    .row:last-child{ border-bottom:none; }
    .dimName{ font-size:13px; color:rgba(242,244,248,.9); }
    .dimHint{ font-size:12px; color:var(--muted2); }
    .pct{ font-variant-numeric: tabular-nums; font-size:13px; color:rgba(242,244,248,.9); }

    #gate .hint{
      margin-top:10px;
      font-size:12px;
      color:var(--muted2);
      line-height:1.6;
    }

      width:100%;
      padding:14px;
      border-radius:16px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.20);
      color:var(--text);
      font-size:15px;
      outline:none;
    }
    .error{
      color:#ff8b8b;
      font-size:13px;
      margin-top:10px;
      display:none;
    }
    .smallActions{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .ghost{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      color:var(--text);
      font-size:13px;
      cursor:pointer;
    }
    .ghost:hover{ background:rgba(255,255,255,.09); }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- ===== 封面 / 密码入口（默认显示） ===== -->
    <div class="card" id="gate">
      <div class="top">
        <div>
          <h1>测一测｜你最适合生活的城市</h1>
        </div>
        <span class="pill">需要密码</span>
      </div>

      <div class="progress"><div class="bar" style="width:100%"></div></div>

      <div class="q">请输入访问密码</div>
      <div class="opts">
        <input id="pwd" type="password" placeholder="Password" autocomplete="off" />
        <button class="opt" id="enter">进入</button>
      </div>

      <div class="error" id="err">密码错误</div>

      <div class="smallActions">
        <button class="ghost" id="clearBox">清空输入</button>
        <button class="ghost" id="about">说明</button>
      </div>


    </div>

    <!-- ===== 测试内容（默认隐藏，验证后显示） ===== -->
    <div class="card" id="app" style="display:none;"></div>
  </div>

<script>

// ✅ city56 的 SHA-256（固定值；页面里不会出现明文 city56）
const PASSWORD_SHA256 = "124efdf68402bdbd0e5e9a7601f0bfd0edd74eb026d10b4d97ee3cae4e283bd2";

function showMain(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "";
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  const arr = Array.from(new Uint8Array(buf));
  return arr.map(b => b.toString(16).padStart(2,"0")).join("");
}

function fail(){
  const err = document.getElementById("err");
  err.style.display = "block";
}

document.getElementById("enter").onclick = check;
document.getElementById("pwd").addEventListener("keydown", e=>{
  if(e.key === "Enter") check();
});
document.getElementById("clearBox").onclick = ()=>{
  document.getElementById("pwd").value = "";
  document.getElementById("err").style.display = "none";
  document.getElementById("pwd").focus();
};

async function check(){
  const v = document.getElementById("pwd").value.trim();
  document.getElementById("err").style.display = "none";
  if(!v){ fail(); return; }
  try{
    const h = await sha256Hex(v);
    if(h === PASSWORD_SHA256){
      showMain();
      render(); // 进入主应用
    }else{
      fail();
    }
  }catch(e){
    fail();
  }
}

/* ======================================================
   下面开始：你的“56城测试”主逻辑
   ====================================================== */

/**
 * 8维度匹配（生活方式）

 * drive 驱动力（生活 ↔ 事业）
 * nature 自然依赖（城市也行 ↔ 自然续命）
 * social 社交电量（安静 ↔ 热闹）
 * aesthetics 氛围偏好（功能 ↔ 氛围）
 * cost 成本耐受（低压 ↔ 能扛）
 */
const DIM = ["pace","climate","density","drive","nature","social","aesthetics","cost"];
const DIM_TEXT = {
  pace: ["慢一点","快一点"],
  climate: ["偏冷","偏暖"],
  density: ["松一点","密一点"],
  drive: ["生活优先","事业优先"],
  nature: ["自然无所谓","自然很重要"],
  social: ["偏安静","偏热闹"],
  aesthetics: ["偏功能","偏氛围"],
  cost: ["压力小","能扛成本"]
};

function q(t, a, b){ return { t, a, b }; }
function opt(text, d){ return { text, d }; }

// helper
function city(name, vec, tags, scene){ return { name, vec, tags, scene }; }
function v(o){ return Object.fromEntries(DIM.map(k => [k, o[k] ?? 0])); }

/* ===== 评分与匹配 ===== */
let idx = 0;
let score = Object.fromEntries(DIM.map(k => [k, 0]));
QUESTIONS.forEach(x => { x._picked = null; });

// 每个维度的“理论最大绝对值”，用于把分数映射到 0~100%
const MAX_ABS = computeMaxAbs();

function computeMaxAbs(){
  const m = Object.fromEntries(DIM.map(k => [k, 0]));
  for(const qu of QUESTIONS){
    for(const side of [qu.a, qu.b]){
      for(const k of DIM){
        m[k] += Math.abs(side.d[k] ?? 0);
      }
    }
  }
  for(const k of DIM) m[k] = Math.max(1, Math.round(m[k]/2));
  return m;
}

function addDelta(delta){
  for(const k of DIM) score[k] += (delta[k] ?? 0);
}

function normalize(v){
  const arr = DIM.map(k => v[k] || 0);
  const norm = Math.sqrt(arr.reduce((s,x)=>s+x*x,0)) || 1;
  const out = {};
  DIM.forEach((k,i)=>out[k]=arr[i]/norm);
  return out;
}

function dot(a,b){
  let s=0;
  for(const k of DIM) s += (a[k]||0)*(b[k]||0);
  return s;
}

function pickCity(){
  const sv = normalize(score);
  let best=null, bestScore=-Infinity;
  for(const c of CITY_PROFILES){
    const cv = normalize(c.vec);
    const s = dot(sv, cv);
    if(s>bestScore){ bestScore=s; best=c; }
  }
  return { best, sv };
}

function tonePick(v, pos, neg, mid){
  if (v > 0.35) return pos;
  if (v < -0.35) return neg;
  return mid;
}

  const l1 = tonePick(
    sv.pace,
    "你其实挺吃“推进感”的。事情能往前走，心就会稳下来，整个人也更清醒。",

  const l2 = tonePick(

    "你会被机会密度吸引。不是想卷到发光，是喜欢努力有回声、路径更清楚的感觉。",

  const l3 = tonePick(

  const things = [];
  const tags = new Set(best.tags);
  const has = (arr)=>arr.some(t=>tags.has(t));

  if(sv.drive > 0.25 && has(["机会密度","全球资源","资源","职业机会","上升通道","科技氛围","金融资源"])){

    things.push("它很“顺”。很多事不用反复纠结，生活会更容易往前走。");

    things.push("它的质感很耐看。不是用力营造的精致，而是日常自带的好看。");

    things.push("它的热度刚好。你想热闹时不缺去处，想安静时也能退回自己的节奏。");

  const fallback = [
    "这里不太为难人。你只要照着自己的节奏过，日子会越来越顺。",
    "它很适合长期住。不是一下子惊艳，是越住越舒服的那种。",
    "在这里生活会更有落地感。不用一直撑着，也不会总是漂着。"
  ];
  while(things.length < 3) things.push(fallback.shift());
  return things.slice(0,3);
}

function asParagraphs(lines, soft=false){
  const cls = soft ? "p soft" : "p";
  return `<div class="prose">${lines.map(x=>`<p class="${cls}">${x}</p>`).join("")}</div>`;
}

function toPercentByDim(){
  const out = {};
  for(const k of DIM){
    const m = MAX_ABS[k] || 1;
    const raw = score[k];
    let p = ((raw + m) / (2*m)) * 100;
    p = Math.max(0, Math.min(100, p));
    out[k] = p;
  }
  return out;
}

function drawRadar(canvas, values, labels){
  const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
  const cssSize = Math.min(canvas.clientWidth || 360, 460);
  const size = Math.floor(cssSize * dpr);
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,size,size);

  const cx = size/2;
  const cy = size/2;
  const r  = size * 0.36;

  const grid = "rgba(255,255,255,.14)";
  const axis = "rgba(255,255,255,.18)";
  const text = "rgba(242,244,248,.82)";
  const polyStroke = "rgba(255,255,255,.75)";
  const polyFill = "rgba(255,255,255,.10)";

  const n = labels.length;
  const rings = 4;

  ctx.lineWidth = 1 * dpr;
  for(let i=1;i<=rings;i++){
    const rr = (r * i) / rings;
    ctx.beginPath();
    for(let j=0;j<n;j++){
      const ang = (-Math.PI/2) + (j * 2*Math.PI/n);
      const x = cx + rr*Math.cos(ang);
      const y = cy + rr*Math.sin(ang);
      if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = grid;
    ctx.stroke();
  }

  ctx.font = `${12*dpr}px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = text;

  for(let j=0;j<n;j++){
    const ang = (-Math.PI/2) + (j * 2*Math.PI/n);
    const x2 = cx + r*Math.cos(ang);
    const y2 = cy + r*Math.sin(ang);

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = axis;
    ctx.stroke();

    const tx = cx + (r + size*0.06)*Math.cos(ang);
    const ty = cy + (r + size*0.06)*Math.sin(ang);

    const label = labels[j];
    const w = ctx.measureText(label).width;

    let dx = -w/2;
    if(Math.cos(ang) > 0.35) dx = 0;
    if(Math.cos(ang) < -0.35) dx = -w;

    let dy = 4*dpr;
    if(Math.sin(ang) > 0.35) dy = 12*dpr;
    if(Math.sin(ang) < -0.35) dy = 0;

    ctx.fillText(label, tx + dx, ty + dy);
  }

  ctx.beginPath();
  for(let j=0;j<n;j++){
    const ang = (-Math.PI/2) + (j * 2*Math.PI/n);
    const p = Math.max(0, Math.min(1, (values[j]||0)/100));
    const rr = r * p;
    const x = cx + rr*Math.cos(ang);
    const y = cy + rr*Math.sin(ang);
    if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = polyFill;
  ctx.fill();
  ctx.strokeStyle = polyStroke;
  ctx.lineWidth = 2 * dpr;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,3*dpr,0,Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.fill();
}

function legendRow(name, hintPair, pct){
  const left = hintPair[0];
  const right = hintPair[1];
  const show = Math.round(pct);
  const hint = `${left}  ↔  ${right}`;
  return `
    <div class="row">
      <div>
        <div class="dimName">${name}</div>
        <div class="dimHint">${hint}</div>
      </div>
      <div class="pct">${show}%</div>
    </div>
  `;
}

/* ===== UI ===== */
function render(){
  const app = document.getElementById("app");
  if(idx < QUESTIONS.length){
    const qu = QUESTIONS[idx];
    const pct = Math.round((idx / QUESTIONS.length) * 100);

    app.innerHTML = `
      <div class="top">
        <div>
          <h1>测一测｜你最适合生活的城市（56城）</h1>
          <div class="sub">跟着第一反应选就行。它更像一次轻量的生活方式匹配，不是标准答案。</div>
        </div>
        <span class="pill">${idx+1} / ${QUESTIONS.length}</span>
      </div>

      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>

      <div class="q">${qu.t}</div>

      <div class="opts">
        <button class="opt" id="A">A. ${qu.a.text}</button>
        <button class="opt" id="B">B. ${qu.b.text}</button>
      </div>

      <div class="actions">
        <button class="btn" id="back" ${idx===0 ? "disabled":""}>上一步</button>
        <button class="btn" id="restart">重来一次</button>
      </div>

      <div class="softNote">提示：娱乐向体验，结果用于参考。状态不同，答案也可能不同。</div>
    `;

    document.getElementById("A").onclick = () => { qu._picked="A"; addDelta(qu.a.d); idx++; render(); };
    document.getElementById("B").onclick = () => { qu._picked="B"; addDelta(qu.b.d); idx++; render(); };

    document.getElementById("back").onclick = () => {
      idx = Math.max(0, idx - 1);
      score = Object.fromEntries(DIM.map(k => [k, 0]));
      for(let i=0;i<idx;i++){
        const qi = QUESTIONS[i];
        if(qi._picked === "A") addDelta(qi.a.d);
        if(qi._picked === "B") addDelta(qi.b.d);
      }
      render();
    };

    document.getElementById("restart").onclick = () => {
      idx = 0;
      score = Object.fromEntries(DIM.map(k => [k, 0]));
      QUESTIONS.forEach(x=>x._picked=null);
      render();
    };

  } else {
    const { best, sv } = pickCity();
    const p3 = portrait3(sv);
    const why = whyThisCity(best, sv);
    const like3 = threeThings(best, sv);

    const perc = toPercentByDim();
    const labels = ["节奏", "气候", "密度", "驱动", "自然", "社交", "氛围", "成本"];
    const values = [perc.pace, perc.climate, perc.density, perc.drive, perc.nature, perc.social, perc.aesthetics, perc.cost];

    app.innerHTML = `
      <div class="top">
        <div>
          <h1>结果出来了</h1>
          <div class="sub">不是“哪里最好”，而是“哪里更适合你现在的生活方式”。</div>
        </div>
        <span class="pill">最终匹配</span>
      </div>

      <div class="section box">
        <div class="k">最适合生活的城市</div>
        <div class="cityName"><strong>${best.name}</strong></div>
        ${asParagraphs(p3, false)}
      </div>

      <div class="section box">
        <div class="k">你的画像分布</div>
        <div class="radarWrap">
          <div class="radarCanvasBox">
            <canvas id="radar" aria-label="雷达图"></canvas>
          </div>
          <div class="radarLegend" id="legend">
            ${legendRow("节奏", DIM_TEXT.pace, perc.pace)}
            ${legendRow("气候", DIM_TEXT.climate, perc.climate)}
            ${legendRow("密度", DIM_TEXT.density, perc.density)}
            ${legendRow("驱动", DIM_TEXT.drive, perc.drive)}
            ${legendRow("自然", DIM_TEXT.nature, perc.nature)}
            ${legendRow("社交", DIM_TEXT.social, perc.social)}
            ${legendRow("氛围", DIM_TEXT.aesthetics, perc.aesthetics)}
            ${legendRow("成本", DIM_TEXT.cost, perc.cost)}
            <div class="softNote" style="margin-top:10px;">
              小提示：越靠右的百分比，越接近这一维度的“右侧偏好”。它不是好坏，只是倾向。
            </div>
          </div>
        </div>
      </div>

      <div class="section grid">
        <div class="box">
          <div class="k">为什么会匹配到它</div>
          ${asParagraphs(why, false)}
        </div>

        <div class="box">
          <div class="k">在这里更容易喜欢上的三件事</div>
          ${asParagraphs(like3, false)}
        </div>
      </div>

      <div class="section box">
        <div class="k">一段城市小片段</div>
        ${asParagraphs(best.scene, true)}
      </div>

      <div class="section box">
        <div class="k">关键词</div>
        <div class="tags">
          ${best.tags.map(t=>`<span class="tag">${t}</span>`).join("")}
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="restart2">再测一次</button>
      </div>

      <div class="softNote">
        想分享的话，直接截图“画像分布 + 城市名”那一段就够好看。
      </div>
    `;

    const canvas = document.getElementById("radar");
    drawRadar(canvas, values, labels);

    window.addEventListener("resize", () => {
      const c = document.getElementById("radar");
      if(c) drawRadar(c, values, labels);
    }, { passive:true });

    document.getElementById("restart2").onclick = () => {
      idx = 0;
      score = Object.fromEntries(DIM.map(k => [k, 0]));
      QUESTIONS.forEach(x=>x._picked=null);
      render();
    };
  }
}
</script>
